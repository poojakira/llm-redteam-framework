# owasp_llm_mapping.yaml
# Maps implemented detector surfaces to the OWASP Top 10 for LLM Applications 2025.
# Reference: https://genai.owasp.org/llm-top-10/
#
# Important: this file is a product-scope map, not a claim that the framework
# fully mitigates every risk category listed below.

version: "2025"
source: "https://genai.owasp.org/llm-top-10/"

mappings:
  - owasp_id: LLM01
    title: Prompt Injection
    status: implemented_partial
    detectors:
      - module: redteam.detectors.embedding_similarity
        class: EmbeddingSimilarityDetector
        rule_ids:
          - LLM01-EmbeddingSimilarity
          - LLM01-IndirectInjection
        scope: lexical/embedding-similarity prompt-injection signals
    notes: >
      This is detector evidence only. The current OOD benchmark demonstrates
      that novel phrasing can evade the baseline.

  - owasp_id: LLM02
    title: Sensitive Information Disclosure
    status: implemented_partial
    detectors:
      - module: redteam.detectors.pii_leakage
        class: PIILeakageDetector
        rule_ids:
          - SEC-OPENAI-KEY
          - SEC-AWS-KEY
          - SEC-AWS-SECRET
          - SEC-GH-TOKEN
          - SEC-PRIVATE-KEY
          - SEC-BASIC-AUTH
          - SEC-DB-URL
          - SEC-BEARER
          - SEC-GENERIC-PWD
          - SEC-HIGH-ENTROPY
          - PII-EMAIL
          - PII-SSN
          - PII-CREDIT-CARD
          - PII-PHONE
      - module: redteam.detectors.canary_tracker
        class: CanaryTokenTracker
        rule_ids:
          - LLM02-CanaryFired
      - module: redteam.detectors.rag_poisoning
        class: RAGPoisoningDetector
        rule_ids:
          - LLM02-CanaryLeakage
    notes: >
      Pattern/entropy/canary evidence does not prove absence of sensitive-data
      disclosure when no finding is produced.

  - owasp_id: LLM03
    title: Supply Chain
    status: not_implemented
    detectors: []
    notes: >
      Model/repository supply-chain scanning is handled by the separate
      hf-model-provenance-scanner product, not by this framework.

  - owasp_id: LLM04
    title: Data and Model Poisoning
    status: implemented_partial
    detectors:
      - module: redteam.detectors.rag_poisoning
        class: RAGPoisoningDetector
        rule_ids:
          - LLM04-RAGPoisoning
        scope: injection-shaped poisoned retrieval context
    notes: >
      This does not detect arbitrary training-data poisoning, model poisoning,
      clean-label poisoning, or vector-store compromise.

  - owasp_id: LLM05
    title: Improper Output Handling
    status: not_implemented
    detectors: []
    notes: >
      SARIF serialization is not an output-sanitization control. Downstream
      output validation remains the responsibility of the integrating system.

  - owasp_id: LLM06
    title: Excessive Agency
    status: implemented_partial
    detectors:
      - module: redteam.detectors.tool_permissions
        class: ToolPermissionBoundaryDetector
        rule_ids:
          - LLM06-UNDECLARED-TOOLS
          - LLM06-TOOL-OUTSIDE-BOUNDARY
          - LLM06-DENIED-TOOL-ARGUMENT
          - LLM06-MALFORMED-TOOL-CALL
          - LLM06-MALFORMED-TOOL-ARGUMENTS
        scope: deterministic declared tool/argument permission boundary
    notes: >
      This validates declared least-privilege boundaries. It does not determine
      whether an otherwise permitted action is semantically correct or approved.

  - owasp_id: LLM07
    title: System Prompt Leakage
    status: not_implemented
    detectors: []
    notes: >
      Generic secret/PII patterns may incidentally detect leaked material, but
      this framework does not claim a dedicated system-prompt-leakage detector.

  - owasp_id: LLM08
    title: Vector and Embedding Weaknesses
    status: not_implemented
    detectors: []
    notes: >
      Embedding similarity for prompt classification is not equivalent to
      validating vector-store authorization, tenant isolation, retrieval
      integrity, or embedding poisoning.

  - owasp_id: LLM09
    title: Misinformation
    status: not_implemented
    detectors: []
    notes: No factuality or provenance judge is implemented.

  - owasp_id: LLM10
    title: Unbounded Consumption
    status: mitigated_service_boundary_only
    detectors: []
    notes: >
      The HTTP service applies body, concurrency, timeout, and rate limits.
      Those controls harden this scanner service; they are not a detector for
      unbounded-consumption risk in an arbitrary downstream LLM application.
