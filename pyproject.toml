[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam-framework"
version = "1.0.0"
description = "Offline adversarial-prompt generation and detection framework (no live LLM API required)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pooja Kiran" }]
keywords = ["llm", "red-team", "prompt-injection", "security", "guardrails"]
dependencies = [
    "fastapi>=0.111",
    "numpy>=1.23",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.1",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]
benchmark = ["datasets==2.19.2"]
embeddings = ["sentence-transformers>=2.2"]

[project.scripts]
redteam-eval = "redteam.eval.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["redteam"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]