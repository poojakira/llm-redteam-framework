name: Signed Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  build:
    name: Build & Sign Release
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine sigstore cyclonedx-bom pip-audit

      - name: Run release gates
        env:
          REDTEAM_API_KEY: release-validation-key-at-least-32-characters
          REDTEAM_ENFORCEMENT_MODE: shadow
        run: |
          ruff check .
          ruff format --check .
          mypy src/redteam/ --ignore-missing-imports
          python -m pytest tests/ --cov=redteam --cov-fail-under=90
          pip-audit --skip-editable --progress-spinner=off
          python benchmarks/ood_novel_phrasings.py

      - name: Build wheel and sdist
        run: python -m build

      - name: Generate SBOM (CycloneDX)
        run: |
          cyclonedx-py environment \
            --output sbom.json \
            --format json \
            --schema-version 1.5

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
            sbom.json

      - name: Verify signatures
        run: |
          for f in dist/*.whl dist/*.tar.gz sbom.json; do
            sigstore verify identity \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              "$f"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.json
            dist/*.sigstore.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*.whl dist/*.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Attest service image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90