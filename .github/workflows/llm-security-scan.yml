name: LLM Security Scan

on:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write   # Required to upload SARIF to GitHub Code Scanning
  actions: read

jobs:
  llm-security-scan:
    name: LLM Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install llm-redteam-framework
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run LLM security scan (SARIF output)
        run: |
          python -m redteam.cli.scan \
            --input tests/fixtures/scan_corpus.jsonl \
            --output-sarif results.sarif
        env:
          # This workflow is for continuous VISIBILITY (SARIF -> Security tab),
          # not a build gate. The evaluation is SUPPOSED to detect injections in
          # its corpus  --  that's the tool working, not a vulnerability. So we do
          # not fail the build on expected eval findings.
          LLM_SECURITY_FAIL_ON: never

      - name: Upload SARIF to GitHub Code Scanning
        # Runs even if the scan step fails  --  so findings appear in the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          sarif_file: results.sarif
          category: llm-security

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=redteam \
            --cov-report=term-missing \
            --cov-fail-under=60

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
          cache: "pip"
      # Pin ruff to match pyproject [dev] (ruff==0.16.8) and the main CI job.
      # A different ruff version formats assert-with-message differently, so
      # mixing versions across workflows makes them mutually unsatisfiable.
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .
