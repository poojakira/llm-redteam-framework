name: LLM Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Daily scan at 06:00 UTC  --  continuous assurance, not point-in-time
    - cron: "0 6 * * *"

permissions:
  contents: read
  security-events: write   # Required to upload SARIF to GitHub Code Scanning
  actions: read

jobs:
  llm-security-scan:
    name: LLM Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install llm-redteam-framework
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run LLM security scan (SARIF output)
        run: |
          python -m redteam.cli.scan \
            --input tests/fixtures/scan_corpus.jsonl \
            --output-sarif results.sarif
        env:
          # This workflow is for continuous VISIBILITY (SARIF -> Security tab),
          # not a build gate. The evaluation is SUPPOSED to detect injections in
          # its corpus  --  that's the tool working, not a vulnerability. So we do
          # not fail the build on expected eval findings.
          LLM_SECURITY_FAIL_ON: never

      - name: Upload SARIF to GitHub Code Scanning
        # Runs even if the scan step fails  --  so findings appear in the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: llm-security

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=redteam \
            --cov-report=term-missing \
            --cov-fail-under=60

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .
