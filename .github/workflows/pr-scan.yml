name: LLM Security Scan

on:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write   # required for SARIF upload to GitHub Advanced Security
  pull-requests: write

jobs:
  llm-security-scan:
    name: LLM Red-Team Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run LLM security scan → SARIF output
        id: scan
        run: |
          python -m redteam.cli.scan \
            --input tests/fixtures/scan_corpus.jsonl \
            --output-sarif results/scan.sarif \
            --fail-on-high
        continue-on-error: true   # capture exit code; block PR below

      - name: Upload SARIF to GitHub Advanced Security
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          sarif_file: results/scan.sarif
          category: llm-redteam

      - name: Report findings (informational)
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::warning::LLM security scan reported findings in the test corpus."
          echo "::warning::The corpus (tests/fixtures/scan_corpus.jsonl) intentionally"
          echo "::warning::contains injection samples, so findings here are expected  -- "
          echo "::warning::they confirm the detector works. See the Security tab for detail."

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          category: codeql-python
