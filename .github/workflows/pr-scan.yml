name: LLM Security Scan

on:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write   # required for SARIF upload to GitHub Advanced Security
  pull-requests: write

jobs:
  llm-security-scan:
    name: LLM Red-Team Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run LLM security scan → SARIF output
        id: scan
        run: |
          python -m redteam.cli.scan \
            --input tests/fixtures/scan_corpus.jsonl \
            --output-sarif results/scan.sarif \
            --fail-on-high
        continue-on-error: true   # capture exit code; block PR below

      - name: Upload SARIF to GitHub Advanced Security
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results/scan.sarif
          category: llm-redteam

      - name: Report findings (informational)
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::warning::LLM security scan reported findings in the test corpus."
          echo "::warning::The corpus (tests/fixtures/scan_corpus.jsonl) intentionally"
          echo "::warning::contains injection samples, so findings here are expected  -- "
          echo "::warning::they confirm the detector works. See the Security tab for detail."

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: codeql-python
